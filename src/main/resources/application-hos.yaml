spring:
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: Cuishihao123
    url: jdbc:mysql://host.mrcsh.cn:3306/zfcloudpandb?timeZone=Asia/Shanghai
    # redis配置
  data:
    redis:
      # Redis数据库索引（默认为0）
      database: 0
      # Redis服务器地址
      host: host.mrcsh.cn
      # Redis服务器连接端口
      port: 6379
      # Redis服务器连接密码（默认为空）
      password: Cuishihao123
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池最大连接数
          max-active: 200
          # 连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms
          # 连接池中的最大空闲连接
          max-idle: 10
          # 连接池中的最小空闲连接
          min-idle: 0

server:
  port: 8080

app:
  # 默认用户注册角色ID
  default-role-id: 0
  # 文件存储位置
  data-save-path: D:/Pan
  # 缓冲区大小
  buffer-size: 8192
############## Sa-Token 配置 (文档: https://sa-token.cc) ##############
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: Authorization
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: false
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: true
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: jwt
  # 是否输出操作日志
  is-log: true
  jwt-secret-key: hksahdlakshsakdhasldasd

minio:
  # 存储桶的名字
  bucketName: develop
